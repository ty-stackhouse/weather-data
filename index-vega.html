<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-<｜begin▁of▁sentence｜>8">
    <title>Overland Park Precipitation</title>
    <!-- Load Plotly.js   -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body  { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        h1  { color: #333; }
         #chart { width: 100%; height: 500px; }
    </style>
</head>
<body>
    <h1>🌧️ Overland Park Precipitation</h1>
    <p>Daily data from NOAA ACIS (Station: KOJC)</p>
    
    <div id="chart"></div>

    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script>
        // 1. URL to your raw CSV file
        const csvUrl = 'precipitation_data.csv';
        
        // Fetch and Parse CSV
        fetch(csvUrl)
            .then((response) => response.text())
            .then((csvString) => {
                let lines = csvString.split("\n");
                
                // Filter out rows with zero precipitation
                const nonZeroData = lines.filter(line =>  line && parseFloat(line.split(",")[1]) !== 0);

                // Group data by Station for Plotly
                let traces = [{
                    x: nonZeroData.map(line => line.split(",")[0]),
                    y: nonZeroData.map(line => parseFloat(line.split(",")[1])),
                    mode: 'lines',
                    name: 'KOJC'
                }];
                
                // Render Chart
                Plotly.newPlot('chart', traces, {
                    title: 'Daily Precipitation Accumulation (Station: KOJC)',
                    xaxis: { title: 'Date' },
                    yaxis: { title: 'Precipitation  (in)' }
                });
            })
            .catch((error) => console.log(error));
    </script>
</body>
</html>
