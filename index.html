<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overland Park Precipitation</title>
    <!-- Load Plotly.js and PapaParse -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        h1 { color: #333; }
        #chart { width: 100%; height: 500px; }

        /* Add these styles for the table */
        #precip-table {
            width: 100%;
            border-collapse: collapse;
        }

        #precip-table th, #precip-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        #precip-table th {
            background-color: #f2f2f2;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }

        #precip-table th span {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <header>
        <h1>🌧️ Overland Park Precipitation</h1>
        <p>Daily data from NOAA ACIS (Stations: KOJC, KIXD, KLWC, KMCI)</p>
    </header>

    <main>
        <section aria-labelledby="today-precip-heading">
            <h2 id="today-precip-heading">Today's Precipitation</h2>
            <p id="today-precip">Today's precipitation so far is 0 in</p>
        </section>
        <section aria-labelledby="precip-table-heading">
            <h2 id="precip-table-heading">Historical Precipitation Data</h2>
            <table id="precip-table" role="grid">
                <thead>
                    <tr>
                        <th scope="col" onclick="sortTable('date')" role="columnheader" aria-sort="descending">
                            Date 
                            <span id="date-sort-indicator">▼</span>
                        </th>
                        <th scope="col" onclick="sortTable('precip_in')" role="columnheader" aria-sort="none">
                            Precipitation (in)
                            <span id="precip-sort-indicator"></span>
                        </th>
                    </tr>
                </thead>
                <tbody id="table-body" role="rowgroup"></tbody>
            </table>
        </section>

        <section aria-labelledby="precip-chart-heading">
            <h2 id="precip-chart-heading">Precipitation Trends</h2>
            <div id="chart" role="img" aria-label="Line chart showing daily precipitation accumulation"></div>
        </section>
    </main>

    <footer>
        <p>Last Updated: <span id="last-updated">Loading...</span></p>
    </footer>

    <script src="table.js"></script>

    <script>
        // 1. URL to your raw CSV file
        const csvUrl = 'precipitation_data.csv';
        let currentSort = { column: 'date', order: 'desc' }; // Default sort

        // 2. Fetch and Parse CSV
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: function(results) {
                const data = results.data;
                
                // Remove empty rows if any
                const cleanData = data.filter(row => row.date && row.station_id);

                // Filter out rows with zero precipitation and only include KOJC station
                let nonZeroData = cleanData.filter(row => row.station_id === "KOJC" && parseFloat(row.precip_in) !== 0);

                // Sort nonZeroData by date in descending order
                nonZeroData.sort((a, b) => new Date(b.date) - new Date(a.date));

                // 3. Group data by Station for Plotly
                const stations = [...new Set(cleanData.map(d => d.station_id))];
                const traces = stations.map(station => {
                    const stationData = cleanData.filter(d => d.station_id === station);
                    return {
                        x: stationData.map(d => d.date),
                        y: stationData.map(d => d.precip_in),
                        mode: 'lines',
                        name: station
                    };
                });

                // 4. Render Chart
                Plotly.newPlot('chart', traces, {
                    title: 'Daily Precipitation Accumulation',
                    xaxis: { title: 'Date' },
                    yaxis: { title: 'Precipitation (in)' }
                });

                // Render Table
                renderTable(nonZeroData);
                sortTable('date'); // Default sort by date descending
                let currentSort = { column: 'date', order: 'desc' }; // Default sort

                function sortTable(column) {
                    const order = (currentSort.column === column && currentSort.order === 'desc') ? 'asc' : 'desc';
                    currentSort = { column, order };

                    const sortedData = [...nonZeroData].sort((a, b) => {
                        if (column === 'date') {
                            return order === 'desc' ? new Date(b.date) - new Date(a.date) : new Date(a.date) - new Date(b.date);
                        } else if (column === 'precip_in') {
                            return order === 'desc' ? b.precip_in - a.precip_in : a.precip_in - b.precip_in;
                        }
                        return 0;
                    });

                    renderTable(sortedData);
                }
            }
        });
    </script>
</body>
</html>
